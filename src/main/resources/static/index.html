<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library System</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div id="app"></div>

<!-- User Creation Modal -->
<div class="modal fade" id="createUserModal" tabindex="-1" aria-labelledby="createUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="createUserAlert" class="alert alert-danger d-none"></div>
                <form id="createUserForm">
                    <div class="mb-3">
                        <label for="newUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="newUsername" required>
                    </div>
                    <div class="mb-3">
                        <label for="newEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="newEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="newPassword" required>
                    </div>
                    <div class="mb-3">
                        <label for="newRole" class="form-label">Role</label>
                        <select class="form-select" id="newRole" required>
                            <option value="">Select Role</option>
                            <option value="ADMIN">Admin</option>
                            <option value="LIBRARIAN">Librarian</option>
                            <option value="MEMBER">Member</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <button type="button"
                        class="btn btn-library"
                        id="createUserBtn">
                    Create User
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Book Creation Modal -->
<div class="modal fade" id="addBookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="addBookAlert" class="alert alert-danger d-none"></div>
                <form id="addBookForm">
                    <div class="mb-3">
                        <label for="bookTitle" class="form-label">Title</label>
                        <input type="text" class="form-control" id="bookTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookAuthor" class="form-label">Author</label>
                        <input type="text" class="form-control" id="bookAuthor" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookIsbn" class="form-label">ISBN</label>
                        <input type="text" class="form-control" id="bookIsbn" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookCategory" class="form-label">Category</label>
                        <input type="text" class="form-control" id="bookCategory" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookCoverUrl" class="form-label">Cover Image URL (Optional)</label>
                        <input type="text" class="form-control" id="bookCoverUrl" placeholder="Leave blank for default image">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-library" onclick="submitNewBook()">Save Book</button>
            </div>
        </div>
    </div>
</div>

<!-- Book Detail Modal -->
<div class="modal fade" id="bookDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="detailModalTitle">Book Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <img id="detailCoverImage" src="" alt="Book Cover" class="img-fluid mb-3 rounded shadow" style="max-height: 250px; object-fit: cover;">

                <h4 id="detailTitle" class="mb-1">Book Title</h4>
                <p class="text-muted mb-3">by <span id="detailAuthor"></span></p>

                <ul class="list-group list-group-flush text-start mb-3">
                    <li class="list-group-item"><strong>ISBN:</strong> <span id="detailIsbn"></span></li>
                    <li class="list-group-item"><strong>Category:</strong> <span id="detailCategory"></span></li>
                    <li class="list-group-item"><strong>Status:</strong> <span id="detailStatus"></span></li>
                </ul>

                <div id="detailActionArea"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/admin/user-management.js"></script>
<script src="/js/admin/rule-management.js"></script>
<script src="/js/librarian/book-management.js"></script>
<script src="/js/librarian/librarian-borrow-records.js"></script>
<script src="/js/member/member-books.js"></script>
<script src="/js/member/member-borrow-records.js"></script>
</body>
</html>
