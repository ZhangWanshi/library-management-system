spring:
  application:
    name: library-management-system
  datasource:
    url: jdbc:mysql://localhost:3306/library_db
    username: root
    password: 123321
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always
  web:
    error:
      include-stacktrace: always
      include-exception: true

server:
  port: 8081
